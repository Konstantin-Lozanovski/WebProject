<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Log in - Pickup Game Organizer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="mockups.css" rel="stylesheet" />
  </head>
  <!-- flex column + min-vh-100 keeps the footer at the bottom on short pages -->
  <body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark topbar">
      <div class="container">
        <a class="navbar-brand" href="index.html">Pickup Game Organizer</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="create-game.html">Create game</a></li>
            <li class="nav-item"><a class="nav-link" href="my-games.html">My games</a></li>
            <li class="nav-item"><a class="nav-link" href="admin.html">Admin overview</a></li>
            <li class="nav-item"><a class="nav-link" href="db.html">Database</a></li>
          </ul>
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link active" href="login.html">Log in</a></li>
            <li class="nav-item"><a class="nav-link" href="register.html">Register</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container flex-grow-1 py-4">
      <div class="row justify-content-center">
        <div class="col-12 col-sm-10 col-md-7 col-lg-5">
          <h1 class="h2 mb-4">Log in</h1>

          <form class="card card-body" action="index.html">
            <div class="mb-3">
              <label class="form-label" for="email">Email</label>
              <input class="form-control" type="email" id="email" placeholder="you@example.com" />
            </div>
            <div class="mb-3">
              <label class="form-label" for="password">Password</label>
              <input class="form-control" type="password" id="password" />
            </div>
            <button class="btn btn-primary w-100" type="submit">Log in</button>
          </form>

          <p class="text-center mt-3">No account yet? <a href="register.html">Register</a></p>
        </div>
      </div>
    </main>

    <footer class="footer py-3 mt-auto">
      <div class="container d-flex flex-wrap justify-content-between gap-2">
        <span>Pickup Game Organizer</span>
        <span>Weather data by Open-Meteo</span>
      </div>
    </footer>

    <!-- Bootstrap's own script: needed for the collapsing navigation on small screens -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
